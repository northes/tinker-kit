name: 发布 macOS 安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-frontend:
    name: 准备前端构建产物
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 安装 Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 恢复 Wails CLI 缓存
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-v3.0.0-beta.23

      - name: 安装 Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23

      - name: 构建前端
        run: wails3 task common:build:frontend CI=true BUILD_FLAGS="-tags production"

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: |
            frontend/dist
            frontend/bindings
          if-no-files-found: error
          retention-days: 1

  build:
    name: 构建 Universal
    needs: prepare-frontend
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 解析版本
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "无效的语义化版本: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: 安装 Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 恢复 Wails CLI 缓存
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-v3.0.0-beta.23

      - name: 安装 Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23

      - name: 下载前端构建产物
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: frontend

      - name: 写入 build/config.yml 应用版本
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ['APP_VERSION']
          path = pathlib.Path('build/config.yml')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^(\s*version:\s*")[^"]*("(?:\s*#.*)?)$',
              lambda match: f'{match.group(1)}{version}{match.group(2)}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('build/config.yml: info.version not found')
          path.write_text(updated, encoding='utf-8')
          print(f'build/config.yml info.version -> {version}')
          PY

      - name: 同步构建资源
        run: wails3 task common:update:build-assets

      - name: 构建应用包
        run: wails3 task darwin:package:universal APP_VERSION=${{ steps.version.outputs.version }} PREBUILT_FRONTEND=true

      - name: 校验应用版本与签名
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="bin/TinkerKit.app"
          plist="$app/Contents/Info.plist"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          if [ "$bundle_version" != "$APP_VERSION" ]; then
            echo "Info.plist 版本 $bundle_version 与标签 $APP_VERSION 不一致" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: 生成 ZIP 更新包与 DMG 安装包
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          zip="TinkerKit-${version}-darwin-universal.zip"
          dmg="TinkerKit-${version}-darwin-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent bin/TinkerKit.app "bin/$zip"
          wails3 task darwin:create:dmg
          mv bin/TinkerKit.dmg "bin/$dmg"
          mkdir -p release
          mv "bin/$zip" "bin/$dmg" release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: macos-universal
          path: release/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出提交历史
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v5
        with:
          pattern: macos-*
          path: release
          merge-multiple: true

      - name: 生成更新日志与校验文件
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          target="$GITHUB_SHA"
          if git rev-parse --verify --quiet "${tag}^{commit}" >/dev/null; then
            target="$tag"
          fi
          previous_tag="$(git describe --tags --abbrev=0 "${target}^" 2>/dev/null || true)"
          range="$target"
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$target"
          fi

          commit_count=0
          {
            echo "## Changes"
            echo
            while IFS=$'\t' read -r hash short subject; do
              printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' "$subject" "$short" "$GITHUB_REPOSITORY" "$hash"
              commit_count=$((commit_count + 1))
            done < <(git log --pretty=tformat:'%H%x09%h%x09%s' "$range")
            if [ "$commit_count" -eq 0 ]; then
              echo "- No changes recorded."
            fi
          } > release/RELEASE_NOTES.md

          cd release
          sha256sum TinkerKit-* > SHA256SUMS

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/TinkerKit-*
            release/SHA256SUMS
