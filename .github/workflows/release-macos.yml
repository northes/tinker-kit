name: 发布 macOS 安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 版本标签（例如 v0.2.0）
        required: true

permissions:
  contents: write

jobs:
  prepare-frontend:
    name: 准备前端构建产物
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 恢复 Wails CLI 缓存
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-v3.0.0-beta.9

      - name: 安装 Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - name: 构建前端
        run: wails3 task common:build:frontend CI=true BUILD_FLAGS="-tags production"

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/dist
            frontend/bindings
          if-no-files-found: error
          retention-days: 1

  build:
    name: 构建 Universal
    needs: prepare-frontend
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 解析版本
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "无效的语义化版本: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: 安装 Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 恢复 Wails CLI 缓存
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-v3.0.0-beta.9

      - name: 安装 Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend

      - name: 构建应用包
        run: wails3 task darwin:package:universal APP_VERSION=${{ steps.version.outputs.version }} PREBUILT_FRONTEND=true

      - name: 写入应用版本
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" bin/TinkerKit.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.version }}" bin/TinkerKit.app/Contents/Info.plist

      - name: 导入 Apple 签名证书
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: 签名应用
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" bin/TinkerKit.app
          else
            codesign --force --deep --sign - bin/TinkerKit.app
          fi

      - name: 公证并装订应用
        if: ${{ env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent bin/TinkerKit.app bin/notarize.zip
          xcrun notarytool submit bin/notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple bin/TinkerKit.app

      - name: 生成 ZIP 更新包与 DMG 安装包
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          zip="TinkerKit-${version}-darwin-universal.zip"
          dmg="TinkerKit-${version}-darwin-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent bin/TinkerKit.app "bin/$zip"
          wails3 task darwin:create:dmg
          mv bin/TinkerKit.dmg "bin/$dmg"
          mkdir -p release
          mv "bin/$zip" "bin/$dmg" release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: release/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出提交历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: release
          merge-multiple: true

      - name: 生成更新日志与校验文件
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          target="$GITHUB_SHA"
          if git rev-parse --verify --quiet "${tag}^{commit}" >/dev/null; then
            target="$tag"
          fi
          previous_tag="$(git describe --tags --abbrev=0 "${target}^" 2>/dev/null || true)"
          range="$target"
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$target"
          fi

          commit_count=0
          {
            echo "## Changes"
            echo
            while IFS=$'\t' read -r hash short subject; do
              printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' "$subject" "$short" "$GITHUB_REPOSITORY" "$hash"
              commit_count=$((commit_count + 1))
            done < <(git log --pretty=tformat:'%H%x09%h%x09%s' "$range")
            if [ "$commit_count" -eq 0 ]; then
              echo "- No changes recorded."
            fi
          } > release/RELEASE_NOTES.md

          cd release
          sha256sum TinkerKit-* > SHA256SUMS

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/TinkerKit-*
            release/SHA256SUMS
